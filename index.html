<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古籍 Online Editor - 基础版</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="libraryShell" class="library-shell">
    <header class="library-topbar">
      <div class="library-title-actions">
        <h1>古籍库</h1>
        <button id="newBookBtn" class="primary" type="button">新建</button>
      </div>
      <div class="topbar-actions">
        <span id="authUserLabel" class="muted"></span>
        <button id="authOpenBtn" class="primary" type="button">登录</button>
        <button id="authLogoutBtn" class="mini-btn hidden" type="button">退出协作</button>
        <input id="libraryImportInput" type="file" accept="image/*,.pdf,application/pdf,.xml,text/xml,application/xml" class="hidden" />
      </div>
    </header>
    <main class="library-main">
      <div id="booksList" class="books-list"></div>
    </main>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button id="backToLibraryBtn" class="mini-btn" type="button">返回</button>
      <h1>古籍 Online Editor</h1>
      <div class="topbar-actions">
        <button id="shareBookBtn" class="mini-btn hidden" type="button">共享书籍</button>
        <input id="uploadInput" type="file" accept="image/*,.pdf,application/pdf" class="hidden" />
        <button id="exportXmlBtn" class="primary" type="button">导出文件</button>
      </div>
    </header>

    <main class="layout">
      <aside class="left-panel">
        <div class="panel-title with-action">
          <span>概览</span>
          <div class="panel-title-actions">
            <button id="uploadBtn" class="mini-btn" type="button">添加</button>
            <button id="deleteSelectedImagesBtn" class="mini-btn" type="button">批量删除</button>
          </div>
        </div>
        <div id="thumbList" class="thumb-list"></div>
      </aside>

      <section class="center-panel">
        <div class="viewer-head">
          <div class="viewer-title-wrap">
            <div id="viewerTitle">未选择图片</div>
            <input id="viewerTitleInput" class="hidden" type="text" placeholder="输入图片名称后按回车" />
          </div>
          <button id="renameImageBtn" class="mini-btn" type="button">重命名</button>
        </div>
        <div id="canvasWrap" class="canvas-wrap">
          <img id="mainImage" alt="主编辑图" draggable="false" />
          <div id="drawLayer" class="draw-layer"></div>
        </div>
      </section>

      <aside class="right-panel">
        <div class="panel-title">工作面板</div>

        <div class="main-panel-switcher" id="mainPanelSwitcher">
          <button id="mainPanelBtnEdit" class="switch-btn" type="button">编辑面板</button>
          <button id="mainPanelBtnGlyph" class="switch-btn" type="button">造字面板</button>
        </div>

        <div id="sectionEditWorkspace" class="workspace-panel">
          <div class="panel-switcher" id="panelSwitcher">
            <button id="panelBtnObject" class="switch-btn" type="button">当前对象</button>
            <button id="panelBtnDraw" class="switch-btn" type="button">画框模式</button>
            <button id="panelBtnTags" class="switch-btn" type="button">标签树</button>
          </div>

          <div class="section panel-section" id="sectionProps" data-panel="object">
            <div class="section-title">属性</div>
            <div id="currentTargetHint" class="muted">当前：图片</div>
            <div id="propsEditor"></div>
            <label id="propNoteRow">简体形式
              <textarea id="propNote" rows="2" placeholder="框内简体形式"></textarea>
            </label>
            <label id="propMeaningRow">释义
              <textarea id="propMeaning" rows="2" placeholder="框内古文内容翻译"></textarea>
            </label>
            <div id="unicodeAllocArea" class="hidden-block">
              <label>unicode码
                <input id="propCodepoint" type="text" placeholder="例如：U+E000" readonly />
              </label>
              <div id="unicodeHint" class="muted">选中框后可为未收录字分配编码</div>
            </div>
            <div class="row-actions">
              <button id="propMeaningAutoTranslateBtn" type="button">自动翻译</button>
              <button id="saveCurrentPropsBtn" type="button">保存</button>
            </div>
          </div>

          <div class="section panel-section" id="sectionDraw" data-panel="draw">
            <div class="section-title with-action">
              <span>画框模式</span>
              <button id="autoDrawByAiBtn" class="mini-btn" type="button">自动画框</button>
            </div>
            <div id="editModeArea">
              <div id="drawState" class="muted">编辑模式已开启</div>
              <div class="row-actions single-bottom-gap">
                <button id="startDrawBtn" class="primary">开始添加</button>
                <button id="clearDraftBtn">清空草稿</button>
              </div>
              <label>样式形状
                <select id="annoShapeSelect">
                  <option value="rect">方框</option>
                  <option value="line">横线</option>
                  <option value="wave">波浪线</option>
                </select>
              </label>
              <label>样式颜色
                <div class="color-inline-row">
                  <button id="annoColorPreview" class="color-preview-btn" type="button">改变颜色</button>
                </div>
                <input id="annoColor" class="hidden-color-input" type="color" value="#2e6f86" />
              </label>

              <div class="picker-title">选择标签</div>
              <div id="tagPickerTree" class="tag-tree picker"></div>
              <div id="selectedTagInfo" class="muted"></div>

              <details class="add-tag-box">
                <summary>或新增标签后使用</summary>
                <label>新标签名称
                  <input id="draftTagName" type="text" placeholder="例如：chapter / line / note" />
                </label>
                <label>父标签
                  <select id="draftTagParent"></select>
                </label>
                <label>标签属性(逗号分隔)
                  <input id="draftTagAttrs" type="text" placeholder="例如：id,column,direction" />
                </label>
                <label class="check-line">
                  <input id="addDraftTagToTemplate" type="checkbox" checked />
                  <span>加入模板树</span>
                </label>
                <button id="createDraftTagBtn">创建并选择该标签</button>
              </details>

              <label id="annoTranscriptionRow">简体转写
                <div class="inline-action-row">
                  <input id="annoTranscription" type="text" placeholder="手动输入" />
                  <button id="annoAutoSuggestBtn" class="compact-btn" type="button">自动识别</button>
                </div>
              </label>
              <label id="annoMeaningRow">释义
                <input id="annoMeaning" type="text" placeholder="框内古文内容翻译" />
              </label>
              <button id="saveAnnoBtn" class="primary">保存标注</button>
            </div>
          </div>

          <div class="section panel-section" id="sectionTags" data-panel="tags">
            <div class="section-title">标签树</div>
            <div class="picker-title">当前图片标签树（点击标签高亮对应框线）</div>
            <div id="imageTagTree" class="tag-tree"></div>

            <div id="templateTreeArea">
              <div class="picker-title">模板树（标签+属性，可增删改排）</div>
              <div id="templateTagTree" class="tag-tree"></div>

              <label>选择模板标签
                <select id="templateTagSelect"></select>
              </label>
              <div class="row-actions">
                <button id="tagMoveUpBtn">同级上移</button>
                <button id="tagMoveDownBtn">同级下移</button>
              </div>
              <button id="deleteTagBtn">删除模板标签</button>

              <label>为模板标签新增属性
                <div class="inline-action-row">
                  <input id="newAttrForTemplateTag" type="text" placeholder="属性名，例如：id" />
                  <button id="addAttrBtn" class="compact-btn" type="button">新增属性</button>
                </div>
              </label>
              <label>删除模板标签属性
                <div class="inline-action-row">
                  <select id="templateAttrSelect"></select>
                  <button id="deleteAttrBtn" class="compact-btn" type="button">删除属性</button>
                </div>
              </label>
            </div>
          </div>
        </div>

        <div id="sectionGlyphWorkspace" class="workspace-panel">
          <div class="section">
            <div class="section-title with-action">
              <span>造字面板</span>
              <button id="glyphRuleBtn" class="mini-btn" type="button">分配规则</button>
            </div>

            <div class="glyph-captured-head">
              <div class="picker-title">当前框选字图</div>
              <button id="glyphReselectBtn" class="mini-btn" type="button">重新框选</button>
            </div>
            <img id="glyphCapturedPreview" class="glyph-captured-preview" alt="框选字图预览" />

            <label>字符
              <input id="glyphCharInput" type="text" placeholder="可留空，后续再补" />
            </label>
            <label>指定 unicode
              <input id="glyphManualCodepointInput" type="text" placeholder="例如：U+E123" />
            </label>
            <label>IDS（后续可补上）
              <div class="inline-action-row ids-inline-row">
                <input id="glyphIdsInput" type="text" placeholder="例如：⿰氵𡿺" />
                <select id="glyphIdsPatternSelect">
                  <option value="⿰">⿰ 左右结构</option>
                  <option value="⿱">⿱ 上下结构</option>
                  <option value="⿲">⿲ 左中右结构</option>
                  <option value="⿳">⿳ 上中下结构</option>
                  <option value="⿴">⿴ 全包围结构</option>
                  <option value="⿵">⿵ 上三包围结构</option>
                  <option value="⿶">⿶ 下三包围结构</option>
                  <option value="⿷">⿷ 左三包围结构</option>
                  <option value="⿸">⿸ 左上包围结构</option>
                  <option value="⿹">⿹ 右上包围结构</option>
                  <option value="⿺">⿺ 左下包围结构</option>
                  <option value="⿻">⿻ 镶嵌/重叠结构</option>
                </select>
                <button id="glyphIdsPatternApplyBtn" class="compact-btn" type="button">插入结构</button>
              </div>
            </label>
            <label>备注（可选）
              <input id="glyphNoteInput" type="text" placeholder="备注信息" />
            </label>

            <button id="glyphAutoSuggestBtn" class="compact-btn" type="button">自动识别</button>

            <div class="row-actions">
              <button id="glyphStartCreateBtn" class="primary" type="button">开始造字</button>
              <button id="glyphAssignSaveBtn" type="button">保存造字</button>
            </div>
            <div id="glyphCreateHint" class="muted">未进入造字框选模式</div>

            <div class="picker-title">最近造字记录</div>
            <div id="glyphRecentList" class="tag-tree"></div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="exportFormatModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="exportFormatTitle">
    <div class="modal-card">
      <div id="exportFormatTitle" class="section-title">选择导出格式</div>
      <div class="row-actions">
        <button id="exportAsXmlBtn" class="primary" type="button">导出所有内容 XML</button>
        <button id="exportAsCsvBtn" type="button">导出生僻字表格</button>
      </div>
      <button id="cancelExportFormatBtn" class="mini-btn" type="button">取消</button>
    </div>
  </div>

  <div id="authModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <div class="modal-card">
      <div id="authModalTitle" class="section-title">协作登录</div>
      <label>邮箱
        <input id="authEmailInput" type="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label>密码
        <input id="authPasswordInput" type="password" placeholder="请输入密码" autocomplete="current-password" />
      </label>
      <label>昵称（注册时可选）
        <input id="authDisplayNameInput" type="text" placeholder="例如：小王" autocomplete="nickname" />
      </label>
      <div class="row-actions">
        <button id="authLoginSubmitBtn" class="primary" type="button">登录</button>
        <button id="authRegisterSubmitBtn" type="button">注册</button>
      </div>
      <button id="authCancelBtn" class="mini-btn" type="button">取消</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
